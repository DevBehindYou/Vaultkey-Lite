name: Android CI (build + test)

# Runs on every push and pull request. Uses no secrets, so it works
# immediately on a fresh fork/repo with zero setup — this is the workflow
# that replaces "open it in Android Studio and see if it builds."
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      # No Gradle wrapper is committed (this project was authored without
      # local Gradle available to generate the wrapper jar) — setup-gradle
      # installs the exact pinned version instead, so every `gradle ...`
      # call below runs the same version this project was written against.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Unit tests (vault-core: crypto round-trip tests)
        run: gradle :vault-core:testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle lint --stacktrace

      - name: Build debug APK (all modules)
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vaultkey-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore

name: Flutter CI (analyze + test + build debug APK)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same branch/PR so a rapid push sequence doesn't
# queue a pile of redundant builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin the SDK for reproducible builds. Bump deliberately; must be a
          # real published Flutter release shipping Dart >= 3.4 (see pubspec).
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: flutter pub get
        run: flutter pub get

      # Advisory for now (continue-on-error) so a formatting nit never blocks a
      # build. Once the tree has been through `dart format .` once, flip this to
      # a hard gate by removing continue-on-error.
      - name: Check formatting (dart format)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test (Dart widget/unit tests)
        run: flutter test

      # This repo has no committed Gradle wrapper under android/ — it was
      # authored in a sandbox with no Flutter SDK/network to generate the
      # real wrapper jar via `flutter create`. Bootstrapping it from a
      # scratch project (using the real Flutter SDK this job just installed)
      # gets a genuine, correct wrapper without risking a hand-authored
      # binary. See DEPLOYMENT.md for the full explanation.
      - name: Bootstrap Gradle wrapper (see comment above)
        run: |
          flutter create --platforms=android --org com.vaultkey /tmp/wrapper_bootstrap
          cp /tmp/wrapper_bootstrap/android/gradlew android/gradlew
          cp /tmp/wrapper_bootstrap/android/gradlew.bat android/gradlew.bat
          mkdir -p android/gradle/wrapper
          cp /tmp/wrapper_bootstrap/android/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          cp /tmp/wrapper_bootstrap/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: Android unit tests (vault-core: crypto round-trip tests)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :vault-core:testDebugUnitTest --stacktrace

      - name: Build debug APK (Flutter UI + native vault-core/keyboard/autofill, one artifact)
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vaultkey-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

name: Flutter Release (signed AAB + optional Play Store)

# Push a tag like v0.1.0 to trigger a signed release build.
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep this in lockstep with android-ci.yml so release builds match CI.
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: flutter pub get
        run: flutter pub get

      # Same wrapper-bootstrap step as android-ci.yml — see DEPLOYMENT.md.
      - name: Bootstrap Gradle wrapper
        run: |
          flutter create --platforms=android --org com.vaultkey /tmp/wrapper_bootstrap
          cp /tmp/wrapper_bootstrap/android/gradlew android/gradlew
          cp /tmp/wrapper_bootstrap/android/gradlew.bat android/gradlew.bat
          mkdir -p android/gradle/wrapper
          cp /tmp/wrapper_bootstrap/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          # Pin Gradle 8.9 (AGP 8.7.2 requires >= 8.9) — same rationale as android-ci.yml.
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew

      # --- Signing: decode the keystore from a base64 secret ---
      # One-time local setup — see DEPLOYMENT.md for the full walkthrough:
      #   keytool -genkey -v -keystore vaultkey-release.jks -keyalg RSA \
      #     -keysize 2048 -validity 10000 -alias vaultkey
      #   base64 -w0 vaultkey-release.jks   # copy this into the GH secret below
      # Repo secrets needed: VAULTKEY_KEYSTORE_BASE64, VAULTKEY_KEYSTORE_PASSWORD,
      # VAULTKEY_KEY_ALIAS, VAULTKEY_KEY_PASSWORD
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VAULTKEY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::VAULTKEY_KEYSTORE_BASE64 secret is not set — add it under Settings > Secrets and variables > Actions before tagging a release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/vaultkey-release.jks"

      - name: Build signed release AAB
        env:
          VAULTKEY_KEYSTORE_PATH: ${{ runner.temp }}/vaultkey-release.jks
          VAULTKEY_KEYSTORE_PASSWORD: ${{ secrets.VAULTKEY_KEYSTORE_PASSWORD }}
          VAULTKEY_KEY_ALIAS: ${{ secrets.VAULTKEY_KEY_ALIAS }}
          VAULTKEY_KEY_PASSWORD: ${{ secrets.VAULTKEY_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Also build a signed release APK (handy for direct-install testing)
        env:
          VAULTKEY_KEYSTORE_PATH: ${{ runner.temp }}/vaultkey-release.jks
          VAULTKEY_KEYSTORE_PASSWORD: ${{ secrets.VAULTKEY_KEYSTORE_PASSWORD }}
          VAULTKEY_KEY_ALIAS: ${{ secrets.VAULTKEY_KEY_ALIAS }}
          VAULTKEY_KEY_PASSWORD: ${{ secrets.VAULTKEY_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload AAB + APK as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vaultkey-release-${{ github.ref_name }}
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with the build attached
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true

      # --- Optional: publish straight to the Play Console ---
      - name: Check for Play Store credentials
        id: play_check
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set — skipping Play Store upload. See DEPLOYMENT.md."
          fi

      - name: Upload to Play Console (internal track)
        if: steps.play_check.outputs.has_secret == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.vaultkey.app
          releaseFiles: build/app/outputs/bundle/release/*.aab
          track: internal
          status: draft

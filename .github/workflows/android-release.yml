name: Android Release (signed AAB + optional Play Store)

# Push a tag like v0.1.0 to trigger a signed release build.
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      # --- Signing: decode the keystore from a base64 secret ---
      # One-time local setup to create these secrets:
      #   keytool -genkey -v -keystore vaultkey-release.jks -keyalg RSA \
      #     -keysize 2048 -validity 10000 -alias vaultkey
      #   base64 -i vaultkey-release.jks | pbcopy   # (or base64 -w0 on Linux)
      # Then in the repo: Settings → Secrets and variables → Actions, add:
      #   VAULTKEY_KEYSTORE_BASE64   — the base64 output above
      #   VAULTKEY_KEYSTORE_PASSWORD — the keystore password
      #   VAULTKEY_KEY_ALIAS         — "vaultkey" (or whatever alias you chose)
      #   VAULTKEY_KEY_PASSWORD      — the key password
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VAULTKEY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::VAULTKEY_KEYSTORE_BASE64 secret is not set — add it under Settings > Secrets and variables > Actions before tagging a release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/vaultkey-release.jks"

      - name: Build signed release AAB
        env:
          VAULTKEY_KEYSTORE_PATH: ${{ runner.temp }}/vaultkey-release.jks
          VAULTKEY_KEYSTORE_PASSWORD: ${{ secrets.VAULTKEY_KEYSTORE_PASSWORD }}
          VAULTKEY_KEY_ALIAS: ${{ secrets.VAULTKEY_KEY_ALIAS }}
          VAULTKEY_KEY_PASSWORD: ${{ secrets.VAULTKEY_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --stacktrace

      - name: Also build a signed release APK (handy for direct-install testing)
        env:
          VAULTKEY_KEYSTORE_PATH: ${{ runner.temp }}/vaultkey-release.jks
          VAULTKEY_KEYSTORE_PASSWORD: ${{ secrets.VAULTKEY_KEYSTORE_PASSWORD }}
          VAULTKEY_KEY_ALIAS: ${{ secrets.VAULTKEY_KEY_ALIAS }}
          VAULTKEY_KEY_PASSWORD: ${{ secrets.VAULTKEY_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload AAB + APK as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vaultkey-release-${{ github.ref_name }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release with the build attached
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true

      # --- Optional: publish straight to the Play Console ---
      # Only runs if PLAY_SERVICE_ACCOUNT_JSON is configured. Until you set
      # that secret, this step is skipped and the release still completes —
      # you'll just upload the AAB from the artifact above by hand.
      - name: Check for Play Store credentials
        id: play_check
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set — skipping Play Store upload. See DEPLOYMENT.md for how to set it up."
          fi

      - name: Upload to Play Console (internal track)
        if: steps.play_check.outputs.has_secret == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.vaultkey.app
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: draft
